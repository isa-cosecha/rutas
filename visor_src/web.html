<!doctype html>
<html lang="es" data-ui="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutas por plantío · Programa de Corte 2026-2027 (web)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>/*__CSS__*/
body{display:grid;grid-template-columns:390px 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
header{padding:14px 16px 10px}
.hrow{display:flex;justify-content:space-between;align-items:start;gap:8px}
h1{font-family:var(--f-head);font-weight:700;font-size:21px;margin:0 0 2px}
.sub{color:var(--mute);font-size:12.5px}
#q{margin-top:10px;font:600 16px var(--f-head);padding:10px 12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.filters select{padding:6px 8px;font-size:13px}
.stats{display:flex;gap:12px;align-items:center;padding:8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.stats b{color:var(--ink);font-family:var(--f-head);font-size:15px}
.stats button{margin-left:auto;padding:5px 10px;font-size:13px}
#list{overflow:auto;flex:1;min-height:0}
.it{display:grid;grid-template-columns:58px 1fr auto;gap:2px 8px;padding:7px 16px;border-bottom:1px solid #26382c;cursor:pointer}
.it:hover{background:var(--panel2)} .it.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--amber)}
.it .c{font:700 15px var(--f-head)} .it .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .m{grid-column:2/3;color:var(--mute);font-size:12px} .it .v{grid-column:3;justify-self:end}
#gear{padding:4px 9px;font-size:16px;position:relative}
#gear .qn{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:9px;font:700 10px var(--f-head);padding:1px 5px}
main{position:relative} #map{height:100%}
#card{position:absolute;z-index:500;top:12px;right:12px;width:350px;max-height:calc(100% - 24px);overflow:auto;background:rgba(29,43,34,.97);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:none}
#card h2{font:700 21px var(--f-head);margin:0}
#card .nm{color:var(--mute)}
#card .mn{position:absolute;top:8px;right:8px;padding:2px 9px}
#card.min .body{display:none}
.btns{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
#bClr{padding:6px 10px}
.fnote{background:#3a2f14;border-left:3px solid var(--amber);padding:8px 14px;font-size:12.5px}
.fnote button{margin-left:6px;padding:3px 9px;font-size:12.5px}
#tools{position:absolute;z-index:600;left:10px;top:92px;display:grid;gap:6px;justify-items:start}
#tools button{display:flex;align-items:center;gap:6px;background:rgba(29,43,34,.96);border:1px solid var(--line);border-radius:6px;padding:7px 11px;font:600 13px var(--f-head);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.45)}
#tools button[aria-expanded=true]{border-color:var(--amber)}
#tools button[hidden]{display:none}   /* si no, display:flex anula el atributo hidden y el botón de Formularios se vería aunque el usuario no tenga ninguno */
#tools #tSide{width:36px;justify-content:center;font-size:19px;padding:3px 0;line-height:1.2}
#capPanel{position:absolute;z-index:700;left:62px;top:92px;width:340px;max-height:calc(100% - 108px);overflow:auto;background:rgba(29,43,34,.97);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#capPanel[hidden]{display:none}
.cphd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.cphd h3{font:700 18px var(--f-head);margin:0}.cphd button{padding:2px 9px}
body.sb-off{grid-template-columns:1fr}body.sb-off #side{display:none}
#hint{position:absolute;z-index:400;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(29,43,34,.92);padding:6px 12px;border-radius:5px;font-size:12.5px;color:var(--mute)}
</style>
</head>
<body>
<aside id="side">
  <header>
    <div class="hrow"><div><h1>Rutas por plantío</h1><div class="sub" id="progSub">Programa de Corte 2026-2027 · séptimo borrador</div><div class="sub" id="who" style="color:var(--amber)"></div></div>
      <button id="gear" aria-label="Configuración">⚙<span class="qn" hidden></span></button></div>
    <input id="q" type="search" placeholder="Código o nombre del plantío" autocomplete="off" aria-label="Buscar plantío">
    <div class="filters">
      <select id="fFr" aria-label="Frente"><option value="">Todos los frentes</option></select>
      <select id="fSem" aria-label="Semana"><option value="">Todas las semanas</option></select>
      <select id="fSrc" aria-label="Mapeo"><option value="">Cualquier mapeo</option><option value="26-27">Mapeado 26-27</option><option value="25-26">Solo 25-26 (pendiente)</option><option value="none">Sin mapeo</option></select>
      <select id="fVal" aria-label="Validación"><option value="">Cualquier validación</option><option value="none">Sin respuesta</option><option value="Según lo planificado">Según lo planificado</option><option value="Diferente">Trabajado diferente</option><option value="pend">Pendiente de envío</option></select>
      <select id="fFlag" aria-label="Alerta" style="grid-column:1/3"><option value="">Sin filtro de alerta</option></select>
      <button id="bClr" type="button" hidden style="grid-column:1/3">✕ Limpiar filtros</button>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <div id="list" role="listbox" aria-label="Plantíos"></div>
</aside>
<main>
  <div id="map"></div>
  <div id="tools">
    <button id="tSide" type="button" title="Ocultar listado" aria-label="Ocultar listado" aria-expanded="true">«</button>
    <button id="tForms" type="button" title="Formularios de campo" data-ffopen hidden>📝 Formularios<span class="ffn" data-ffbadge hidden></span></button>
    <button id="tCapas" type="button" title="Configuración de capas" aria-expanded="false"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Zm0 12L4.5 11.3 2 12.5l10 5 10-5-2.5-1.2L12 15Zm0 4-7.5-3.7L2 16.5l10 5 10-5-2.5-1.2L12 19Z" fill="currentColor"/></svg> Capas</button>
    <button id="tGear" type="button" hidden title="Mi cuenta" aria-label="Mi cuenta">⚙</button>
  </div>
  <div id="capPanel" hidden role="dialog" aria-label="Configuración de capas"></div>
  <div id="card"></div>
  <div id="hint">Busca un plantío o haz clic en un lote. Flechas ← → recorren la secuencia de corte.</div>
</main>
<!--__DIALOG__-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>/*__CORE__*/</script>
<script>/*__UI__*/</script>
<script>
const $=id=>document.getElementById(id), A=App;
A.init('map',()=>{ const abierto=!$('capPanel').hidden, ancho=$('map').clientWidth;   // si el panel de capas está abierto, el encuadre usa el área libre
  return {paddingTopLeft:[(abierto&&ancho-410-380>=260)?410:60,40],paddingBottomRight:[380,40]}; });
// ---- listado lateral ocultable (se recuerda en este equipo) ----
function setSide(off,persist){
  document.body.classList.toggle('sb-off',off);
  const b=$('tSide'); b.textContent=off?'»':'«'; b.title=off?'Mostrar listado':'Ocultar listado'; b.setAttribute('aria-label',b.title); b.setAttribute('aria-expanded',String(!off));
  $('tGear').hidden=!off; if(persist){ try{localStorage.setItem('rp26_sb',off?'1':'0')}catch{} }
  setTimeout(()=>A.map.invalidateSize(),60);
}
$('tSide').onclick=()=>setSide(!document.body.classList.contains('sb-off'),true);
$('tGear').onclick=()=>UI.openCfg();
let sb0=false; try{ sb0=localStorage.getItem('rp26_sb')==='1'; }catch{}
if(sb0) setSide(true,false);
// ---- panel de configuración de capas (no ocupa la ficha del plantío) ----
function renderCap(){
  const p=$('capPanel'), y=p.scrollTop;
  p.innerHTML='<div class="cphd"><h3>Configuración de capas</h3><button id="capX" type="button" aria-label="Cerrar">✕</button></div>'+A.htmlPanelCapas();
  A.bindCapas(p); $('capX').onclick=()=>toggleCap(false); p.scrollTop=y;
}
function toggleCap(on){ const p=$('capPanel'); on=(on===undefined)?p.hidden:on; p.hidden=!on; $('tCapas').setAttribute('aria-expanded',String(on)); if(on){ renderCap();
  if(A.cur&&A.cur._cen&&A.map.latLngToContainerPoint(A.cur._cen).x<410) A.fitLocal(); } }   // si el panel tapa el plantío, se reencuadra
$('tCapas').onclick=()=>toggleCap();
function fillOpts(){ const fr=$('fFr'), se=$('fSem'), vf=fr.value, vs=se.value; fr.length=1; se.length=1;   // se reconstruyen cuando llega un programa nuevo, conservando lo elegido
  A.options('fr').forEach(v=>fr.add(new Option('Frente '+v,v))); A.options('sem').forEach(v=>se.add(new Option('Semana '+v,String(v)))); fr.value=vf; se.value=vs; }
fillOpts();
const subProg=p=>{ if(p&&p.zafra) $('progSub').textContent='Programa de Corte '+p.zafra+(p.borrador?' · '+p.borrador:''); }; subProg(A.programa);
A.on('programa',p=>{ fillOpts(); subProg(p); });
[['sin_raja','Sin puntos de raja'],['sin_entrada','Sin ruta de entrada'],['sin_salida','Sin ruta de salida'],['raja_fuera','Rajas fuera del polígono'],
 ['no_llega_lote','Ruta termina a >1 km del lote'],['km','Distancia ingenio-lote ≠ Dist KM Mapeado (>15 %)'],['av','Con autovolteo']].forEach(([v,t])=>$('fFlag').add(new Option(t,v)));
function renderList(fl){
  const cur=A.cur;
  $('bClr').hidden=!A.hasFilters();
  const fuera=cur&&A.hasFilters()&&!fl.some(o=>o.id===cur.id);
  const nota=fuera?`<div class="fnote">Estás viendo <b>${cur.id}</b>, que no está en el filtro actual. <button type="button" id="fnClr">Quitar filtros</button></div>`:'';
  $('list').innerHTML=nota+fl.map(o=>`<div class="it${cur&&cur.id===o.id?' on':''}" data-id="${o.id}" role="option" tabindex="0"><span class="c">${o.id}</span><span class="n">${A.esc(o.nm)}</span>
   <span class="tag ${o.src==='26-27'?'t27':o.src?'t26':'tno'}">${o.src||'—'}</span><span class="m">${o.fc||''} · ${A.esc(o.fr||'')} S${o.sem??''}-${o.sec??''} · TCH ${A.fmt(o.tch,0)} · ${A.fmt(o.dP,0)} km</span><span class="v">${A.valTag(A.valOf(o.id))}</span></div>`).join('');
  const n=fl.length,a=fl.filter(o=>o.src==='26-27').length,v=fl.filter(o=>A.valOf(o.id)).length;
  $('stats').innerHTML=`<span><b>${n}</b> plantíos</span><span><b>${a}</b> mapeo 26-27</span><span><b>${v}</b> validados</span>${A.auth.puedeCsv()?'<button id="bCsv" title="Descargar lo filtrado">Descargar CSV</button>':''}`;
  if($('bCsv')) $('bCsv').onclick=A.csv;   // el rol Consulta no ve el botón
}
function card(o){
  const c=$('card');
  c.innerHTML=`<button class="mn" aria-label="Contraer ficha">–</button><h2>${o.id}</h2><div class="nm">${A.esc(o.nm)} ${A.srcTag(o)}</div>
   ${A.htmlKpis(o)}<div class="body"><div class="sec">¿Cómo se trabajó?</div>${A.htmlForm(o)}${A.htmlDetail(o)}
   <div class="btns"><button id="bLot">Encuadrar lote</button><button id="bAll">Ruta completa</button><button id="bPrev">← Anterior</button><button id="bNext">Siguiente →</button></div></div>`;
  c.style.display='block'; A.bind(c,o);
  c.querySelector('.mn').onclick=()=>c.classList.toggle('min');
  $('bLot').onclick=A.fitLocal; $('bAll').onclick=A.fitAll; $('bPrev').onclick=()=>A.step(-1); $('bNext').onclick=()=>A.step(1);
}
A.on('filtered',renderList);
A.on('select',o=>{ card(o); if(!$('capPanel').hidden) renderCap(); $('hint').style.display='none';
  renderList(A.filtered); const e2=document.querySelector(`.it[data-id="${o.id}"]`); e2&&e2.scrollIntoView({block:'nearest'}); });
A.on('status',()=>{ renderList(A.filtered); });
A.on('queue',n=>{ const q=document.querySelector('#gear .qn'); q.hidden=!n; q.textContent=n; });
$('list').addEventListener('click',e=>{ if(e.target.id==='fnClr') return A.clearFilters(); const it=e.target.closest('.it'); if(it) A.select(it.dataset.id);});
const FIDS={q:'q',fr:'fFr',sem:'fSem',src:'fSrc',flag:'fFlag',val:'fVal'};
A.on('filterscleared',()=>{ for(const [k,id] of Object.entries(FIDS)) $(id).value=''; });
$('bClr').onclick=()=>A.clearFilters();
$('list').addEventListener('keydown',e=>{if(e.key==='Enter'){const it=e.target.closest('.it'); if(it) A.select(it.dataset.id);}});
const bindF=(id,k)=>$(id).addEventListener('input',()=>{A.F[k]=$(id).value;A.applyFilters();});
bindF('q','q');bindF('fFr','fr');bindF('fSem','sem');bindF('fSrc','src');bindF('fFlag','flag');bindF('fVal','val');
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&A.filtered[0]) A.select(A.filtered[0].id); if(e.key==='Escape') A.clearFilters();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('capPanel').hidden&&!document.querySelector('dialog[open]')){toggleCap(false);return;}
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||document.querySelector('dialog[open]'))return; if(e.key==='ArrowRight')A.step(1); if(e.key==='ArrowLeft')A.step(-1);});
$('gear').onclick=()=>UI.openCfg();
A.applyFilters(); A.flush(); A.refreshStatus();
const h=location.hash.replace('#p',''); if(A.byId.has(h)) A.select(h);
const showWho=()=>{const s=A.auth.sess; $('who').textContent=s?'👤 '+s.nombre+' · '+s.rol:'';};
showWho(); A.on('login',showWho); A.on('status',showWho); A.on('perfil',showWho);
</script>
</body>
</html>
