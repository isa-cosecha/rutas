<div id="toast" role="status" aria-live="polite"></div>

<div id="login" hidden role="dialog" aria-modal="true" aria-labelledby="lgT">
  <form id="lgForm" class="lgbox" autocomplete="on">
    <h2 id="lgT">Rutas por plantío</h2>
    <div class="lgsub">Programa de Corte 2026-2027</div>
    <div id="lgIn">
      <label>Usuario<input id="lgUser" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Clave<input id="lgPass" type="password" autocomplete="current-password" required></label>
    </div>
    <div id="lgNew" hidden>
      <div class="lgnote">Es tu primer ingreso (o tu clave fue reiniciada). Crea tu propia clave de al menos 6 caracteres.</div>
      <label>Clave nueva<input id="lgN1" type="password" autocomplete="new-password"></label>
      <label>Repite la clave nueva<input id="lgN2" type="password" autocomplete="new-password"></label>
    </div>
    <div id="lgMsg" role="alert"></div>
    <button id="lgGo" class="primary" type="submit">Entrar</button>
    <div id="lgUrlBox" hidden><label>URL del Web App de Apps Script<input id="lgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label></div>
  </form>
</div>

<dialog id="pwDlg"><form method="dialog">
  <h3>Cambiar mi clave</h3>
  <div id="pwMsg" style="color:var(--amber);font-size:13px;min-height:18px"></div>
  <label>Clave actual<input id="pwOld" type="password" autocomplete="current-password"></label>
  <label>Clave nueva (mínimo 6 caracteres)<input id="pwN1" type="password" autocomplete="new-password"></label>
  <label>Repite la clave nueva<input id="pwN2" type="password" autocomplete="new-password"></label>
  <div class="row"><button id="pwCancel" type="button">Cancelar</button><button id="pwOk" class="primary">Cambiar clave</button></div>
</form></dialog>

<dialog id="cfgDlg"><form method="dialog">
  <h3>Mi cuenta</h3>
  <div id="cfgMsg" style="color:var(--amber);font-size:13px"></div>
  <div id="cfgWho" class="who"></div>
  <div class="row" style="justify-content:flex-start;margin:8px 0"><button id="cfgPw" type="button">Cambiar clave</button><button id="cfgOut" type="button">Cerrar sesión</button></div>
  <div id="cfgVer" style="font-size:12.5px;color:var(--mute);margin:8px 0"></div>
  <div id="cfgQ" style="font-size:12.5px;color:var(--mute)"></div>
  <details><summary>Avanzado (conexiones)</summary>
    <label>URL del Web App de Google Apps Script<input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label>URL de datos en GitHub (carpeta data/)<input id="cfgData" type="url" placeholder="https://raw.githubusercontent.com/usuario/repo/main/data/"></label>
    <label>Token de GitHub (solo si el repositorio es privado)<input id="cfgGh" type="password" autocomplete="off" placeholder="github_pat_…"></label>
  </details>
  <div class="row"><button id="cfgReload" type="button">Actualizar datos</button><button id="cfgSync" type="button">Sincronizar ahora</button><button id="cfgCancel" type="button">Cerrar</button><button id="cfgSave" class="primary">Guardar</button></div>
</form></dialog>
