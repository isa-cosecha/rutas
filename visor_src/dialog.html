<div id="toast" role="status" aria-live="polite"></div>
<dialog id="cfgDlg"><form method="dialog">
  <h3>Configuración de respuestas</h3>
  <div id="cfgMsg" style="color:var(--amber);font-size:13px"></div>
  <label>Tu nombre (aparece en cada respuesta)<input id="cfgUser" type="text" autocomplete="name" placeholder="Ej. Juan Pérez – Supervisor K4"></label>
  <label>URL del Web App de Google Apps Script<input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
  <label>Clave de acceso (TOKEN del script, opcional)<input id="cfgTok" type="text" autocomplete="off"></label>
  <label>URL de datos en GitHub (carpeta data/)<input id="cfgData" type="url" placeholder="https://raw.githubusercontent.com/usuario/repo/main/data/"></label>
  <label>Token de GitHub (solo si el repositorio es privado)<input id="cfgGh" type="password" autocomplete="off" placeholder="github_pat_…"></label>
  <div id="cfgVer" style="font-size:12.5px;color:var(--mute);margin-bottom:6px"></div>
  <div id="cfgQ" style="font-size:12.5px;color:var(--mute)"></div>
  <div class="row"><button id="cfgReload" type="button">Actualizar datos</button><button id="cfgSync">Sincronizar ahora</button><button id="cfgCancel">Cancelar</button><button id="cfgSave" class="primary">Guardar</button></div>
</form></dialog>
